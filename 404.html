<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Instrument Error</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0D10">

<!-- Hosts serve this page at any missing address, however deep, so its styles are inline
     and its links start at the site root. It mirrors the matching rules in styles.css. -->
<style>
  :root {
    --bg: #0B0D10; --line: #465059; --edge: #7C858F; --text: #EDE9E3; --muted: #9AA3AD; --accent: #C9A45C;
    --serif: Georgia, Cambria, "Times New Roman", Times, serif;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background-color: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background-color: var(--bg); color: var(--text); font-family: var(--sans); font-size: 1.0625rem; line-height: 1.65; overflow-wrap: break-word; }
  main { flex: 1 0 auto; }
  .wrap { width: 100%; max-width: 46rem; margin-inline: auto; padding-inline: clamp(1rem, 5vw, 2rem); }
  .site-header { border-bottom: 1px solid var(--line); }
  .site-header .wrap { display: flex; align-items: center; min-height: 4rem; }
  .wordmark { font-family: var(--serif); font-size: 1.3rem; letter-spacing: -0.01em; color: var(--text); text-decoration: none; }
  a.wordmark:hover { text-decoration: underline; text-decoration-color: var(--accent); }
  .page { padding-block: clamp(3rem, 10vw, 6rem); }
  .label { margin: 0; font-size: 0.8125rem; font-weight: 600; line-height: 1.4; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .rule { display: block; width: 3.5rem; height: 2px; margin: 0.8rem 0 1.5rem; background: var(--accent); }
  h1 { margin: 0 0 1.25rem; font-family: var(--serif); font-weight: 400; font-size: clamp(2.1rem, 6.2vw, 3.4rem); line-height: 1.1; letter-spacing: -0.02em; }
  p { margin: 0 0 1rem; }
  .lede { max-width: 38rem; font-size: clamp(1.15rem, 2.4vw, 1.3rem); line-height: 1.55; }
  a { color: var(--text); text-decoration-line: underline; text-decoration-color: var(--edge); text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
  a:hover { text-decoration-color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  .site-footer { margin-top: 3rem; padding-block: 2rem 2.5rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.95rem; }
  .site-footer .wrap { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.75rem 2rem; }
  .footer-brand { margin: 0; font-family: var(--serif); color: var(--text); }
  .footer-links { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; margin: 0; padding: 0; list-style: none; }
  .footer-links a { color: var(--muted); }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="/">Instrument Error</a>
  </div>
</header>

<main id="main">
  <div class="wrap page">
    <p class="label">Error 404</p>
    <span class="rule" aria-hidden="true"></span>
    <h1>Page not found</h1>
    <p class="lede">There is no page at this address.</p>
    <p><a href="/">Go to the home page</a></p>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="footer-brand">Instrument Error</p>
    <nav aria-label="Site">
      <ul class="footer-links">
        <li><a href="/privacy">Privacy policy</a></li>
        <li><a href="/terms">Terms of service</a></li>
        <li><a href="https://www.youtube.com/@instrumenterror">YouTube channel</a></li>
      </ul>
    </nav>
  </div>
</footer>
</body>
</html>
